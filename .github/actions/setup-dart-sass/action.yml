name: 'Setup Dart Sass'
description: 'Download and install the Dart Sass CLI on Linux, macOS, Windows and Termux/Android through scripts/install-dart-sass.sh, verifying each archive against the SHA-256 digest published in the GitHub release when available, and put "sass" on PATH. BSD and Solaris/illumos have no official Dart Sass binary; use npm, bun, pnpm, or the OS package manager there.'
inputs:
  dart-sass-version:
    description: 'Dart Sass version to install, with or without the "v" prefix (e.g. "1.105.2"). "latest" resolves the newest release.'
    required: false
    default: 'latest'
  verify-file:
    description: 'Verify the downloaded archive against the SHA-256 digest published in the GitHub release (true/false). Dart Sass publishes no checksum file; releases before 1.89.1 predate the digest feature and are skipped without querying the API. When the digest is unavailable (older releases, or the API is unreachable), verification is skipped with a warning; a mismatching digest always fails the step.'
    required: false
    default: 'true'
  is-musl:
    description: 'Install the musl build (Linux only) (true/false)'
    required: false
    default: 'false'
  install-dir:
    description: 'Directory that receives the "sass" entry point: a symlink to the intact archive payload on Linux/macOS (and on Termux when a native Android build exists), a link or bun wrapper when Termux falls back to bun/pnpm/npm, and "sass.bat" plus a POSIX "sass" wrapper on Windows. Defaults to "/usr/local/bin" when it is writable or reachable through root, passwordless sudo/doas, or pfexec (otherwise "~/.local/bin" in non-interactive runs), to "C:\Program Files\Dart Sass" (64-bit) or "C:\Program Files (x86)\Dart Sass" (32-bit) on Windows when writable (otherwise "%LOCALAPPDATA%\Programs\Dart Sass"), and to "$PREFIX/bin" or "~/.local/bin" on Termux. An explicit directory never falls back silently. On Linux/macOS the payload lives in "<install-dir>/.dart-sass"; the Termux fallback records the manager in "<install-dir>/.dart-sass-package-manager". On Windows the archive is extracted directly into "<install-dir>" ("sass.bat" and "src"), with a POSIX "sass" wrapper beside it.'
    required: false
    default: ''
  downloader:
    description: 'Downloader to use for fetching the Dart Sass binary (auto, curl, wget, aria2/2c or axel). "auto" prefers aria2c, then curl, then wget.'
    required: false
    default: 'aria2'
  downloader-args:
    description: 'Arguments to pass to the downloader (word-split, so avoid embedded spaces)'
    required: false
    default: ''
  github-token:
    description: 'Token used to query the GitHub API when resolving "latest" fails via the releases redirect and when fetching the SHA-256 digest of the downloaded archive (avoids rate limiting). Pass secrets.GITHUB_TOKEN from the caller workflow.'
    required: false
    default: ''
outputs:
  dart-sass-version:
    description: 'The Dart Sass version that was actually installed (without the "v" prefix)'
    value: ${{ steps.install-dart-sass.outputs.dart-sass-version }}
  dart-sass-path:
    description: 'Path to the installed Dart Sass executable (on Windows, the "sass.bat" launcher)'
    value: ${{ steps.install-dart-sass.outputs.dart-sass-path }}
runs:
  using: 'composite'
  steps:
    - name: Install Dart Sass
      id: install-dart-sass
      shell: bash
      env:
        DART_SASS_VERSION: ${{ inputs.dart-sass-version }}
        DART_SASS_VERIFY: ${{ inputs.verify-file }}
        DART_SASS_LIBC: ${{ inputs.is-musl == 'true' && 'musl' || 'auto' }}
        DART_SASS_INSTALL_DIR: ${{ inputs.install-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DOWNLOADER: ${{ inputs.downloader }}
        DOWNLOADER_ARGS: ${{ inputs.downloader-args }}
      run: |
        script="${GITHUB_ACTION_PATH}/../../../scripts/install-dart-sass.sh"
        case "$(uname -s)" in
          MINGW* | MSYS* | CYGWIN*) script="$(cygpath -u "${script}")" ;;
        esac
        sh "${script}" --yes
