name: 'Setup Dart Sass'
description: 'Download and install the Dart Sass CLI on Linux, macOS and Windows runners, verifying each archive against the SHA-256 digest published in the GitHub release when available, and put "sass" on PATH'
inputs:
  dart-sass-version:
    description: 'Dart Sass version to install, with or without the "v" prefix (e.g. "1.105.2"). "latest" resolves the newest release.'
    required: false
    default: 'latest'
  verify-file:
    description: 'Verify the downloaded archive against the SHA-256 digest published in the GitHub release (true/false). Dart Sass publishes no checksum file; releases before 1.89.1 predate the digest feature and are skipped without querying the API. When the digest is unavailable (older releases, or the API is unreachable), verification is skipped with a warning; a mismatching digest always fails the step.'
    required: false
    default: 'true'
  is-musl:
    description: 'Install the musl build (Linux only) (true/false)'
    required: false
    default: 'false'
  install-dir:
    description: 'Directory to install Dart Sass to. Defaults to "/usr/local/bin" on Linux and macOS when it is writable without elevation (otherwise "~/.local/bin"), and to "C:\Program Files\Dart Sass" (64-bit) or "C:\Program Files (x86)\Dart Sass" (32-bit) on Windows when writable (otherwise "%LOCALAPPDATA%\Programs\Dart Sass"). The archive contents (the "sass"/"sass.bat" launcher and its "src" directory) are installed directly into this directory.'
    required: false
    default: ''
  downloader:
    description: 'Downloader to use for fetching the Dart Sass binary (curl, wget, aria2/2c or axel). Falls back to curl when aria2c is not installed.'
    required: false
    default: 'aria2'
  downloader-args:
    description: 'Arguments to pass to the downloader (word-split, so avoid embedded spaces)'
    required: false
    default: ''
  github-token:
    description: 'Token used to query the GitHub API when resolving "latest" fails via the releases redirect and when fetching the SHA-256 digest of the downloaded archive (avoids rate limiting). Pass secrets.GITHUB_TOKEN from the caller workflow.'
    required: false
    default: ''
outputs:
  dart-sass-version:
    description: 'The Dart Sass version that was actually installed (without the "v" prefix)'
    value: ${{ steps.install-dart-sass.outputs.dart-sass-version }}
  dart-sass-path:
    description: 'Path to the installed Dart Sass executable (on Windows, the "sass.bat" launcher)'
    value: ${{ steps.install-dart-sass.outputs.dart-sass-path }}
runs:
  using: 'composite'
  steps:
    - name: Install Dart Sass
      id: install-dart-sass
      shell: bash
      env:
        DART_SASS_VERSION: ${{ inputs.dart-sass-version }}
        DART_SASS_VERIFY_FILE: ${{ inputs.verify-file }}
        IS_MUSL: ${{ inputs.is-musl }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        DOWNLOADER: ${{ inputs.downloader }}
        DOWNLOADER_ARGS: ${{ inputs.downloader-args }}
      run: |
        set -euo pipefail

        #######################################
        # Logging helpers
        #######################################

        die() {
          echo "ERROR: $*" >&2
          exit 1
        }

        note() {
          echo "NOTE: $*"
        }

        warn() {
          echo "WARNING: $*"
        }

        require_cmd() {
          command -v "$1" >/dev/null 2>&1 || die "Required command '$1' is not installed."
        }

        # version_ge A B -- succeeds when A >= B (dotted numeric versions,
        # e.g. 1.105.2). Prerelease suffixes and non-numeric segments
        # compare as 0.
        version_ge() {
          local a="$1" b="$2" i ai bi part
          local -a a_parts b_parts
          IFS='.' read -r -a a_parts <<< "${a}"
          IFS='.' read -r -a b_parts <<< "${b}"
          for i in 0 1 2; do
            part="${a_parts[i]:-0}"; part="${part%%-*}"
            case "${part}" in ''|*[!0-9]*) part=0 ;; esac
            ai=$((10#${part}))
            part="${b_parts[i]:-0}"; part="${part%%-*}"
            case "${part}" in ''|*[!0-9]*) part=0 ;; esac
            bi=$((10#${part}))
            if [ "${ai}" -gt "${bi}" ]; then return 0; fi
            if [ "${ai}" -lt "${bi}" ]; then return 1; fi
          done
          return 0
        }

        #######################################
        # Downloader selection
        #######################################

        DOWNLOADER_CMD="${DOWNLOADER:-aria2}"
        case "${DOWNLOADER_CMD}" in
          aria2|2c) DOWNLOADER_CMD='aria2c' ;;
        esac

        if ! command -v "${DOWNLOADER_CMD}" >/dev/null 2>&1; then
          if [ "${DOWNLOADER_CMD}" = 'aria2c' ]; then
            warn "'aria2c' is not installed on this runner; falling back to curl."
            DOWNLOADER_CMD='curl'
          else
            die "Downloader '${DOWNLOADER_CMD}' is not installed."
          fi
        fi

        if [ -z "${DOWNLOADER_ARGS}" ]; then
          case "${DOWNLOADER_CMD}" in
            aria2c) DOWNLOADER_ARGS="-c -x16 -s16 -j16 -U Mozilla/5.0" ;;
            curl)   DOWNLOADER_ARGS="-L -O -C - -A Mozilla/5.0" ;;
            wget)   DOWNLOADER_ARGS="-c -U Mozilla/5.0" ;;
            axel)   DOWNLOADER_ARGS="-a -n 16 -U Mozilla/5.0" ;;
            mwget)  DOWNLOADER_ARGS="-n 16 -c -U Mozilla/5.0" ;;
          esac
        fi

        # download URL NAME -- no-op when the file already exists and is non-empty
        download() {
          local url="$1" name="$2" attempt
          for attempt in 1 2; do
            if ${DOWNLOADER_CMD} ${DOWNLOADER_ARGS} "${url}"; then
              if [ -s "${name}" ]; then
                return 0
              fi
            fi
            warn "Download attempt ${attempt} failed for ${name}."
            rm -f "${name}" 2>/dev/null || true
          done
          return 1
        }

        #######################################
        # Detect runner OS / architecture
        #######################################

        case "${RUNNER_OS}" in
          Linux)   OS_NAME='linux' ;;
          macOS)   OS_NAME='macos' ;;
          Windows) OS_NAME='windows' ;;
          *)       die "Unsupported runner OS: '${RUNNER_OS}'." ;;
        esac

        # Dart Sass names 32-bit x86 "ia32" and 32-bit ARM "arm"
        case "${RUNNER_ARCH}" in
          X64)   ARCH_NAME='x64' ;;
          X86)   ARCH_NAME='ia32' ;;
          ARM64) ARCH_NAME='arm64' ;;
          ARM)   ARCH_NAME='arm' ;;
          *)     die "Unsupported runner architecture: '${RUNNER_ARCH}'." ;;
        esac

        if [ "${ARCH_NAME}" = 'ia32' ]; then
          note "Dart Sass has not published ia32 (32-bit x86) builds for recent releases, so the download may fail for those versions."
        fi

        # musl is a Linux-only flavour
        DART_SASS_MUSL=''
        if [ "${IS_MUSL:-false}" = 'true' ]; then
          if [ "${OS_NAME}" = 'linux' ]; then
            DART_SASS_MUSL='-musl'
          else
            warn "'is-musl' is only supported on Linux; ignoring it."
          fi
        fi

        FILE_FORMAT='tar.gz'
        if [ "${OS_NAME}" = 'windows' ]; then
          FILE_FORMAT='zip'
        fi

        #######################################
        # Resolve the requested version
        #######################################

        if [ -z "${DART_SASS_VERSION:-}" ] || [ "${DART_SASS_VERSION}" = 'latest' ]; then
          note "Resolving the latest Dart Sass release."
          require_cmd curl

          DART_SASS_VERSION="$(curl -sIL -o /dev/null -w '%{url_effective}' 'https://github.com/sass/dart-sass/releases/latest' | sed -n 's#.*/tag/##p')"

          if [ -z "${DART_SASS_VERSION}" ]; then
            warn "Could not resolve 'latest' through the releases redirect; falling back to the GitHub API."
            API_RESPONSE=''
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              API_RESPONSE="$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" 'https://api.github.com/repos/sass/dart-sass/releases/latest' || true)"
            else
              API_RESPONSE="$(curl -s 'https://api.github.com/repos/sass/dart-sass/releases/latest' || true)"
            fi
            DART_SASS_VERSION="$(printf '%s' "${API_RESPONSE}" | grep '"tag_name"' | head -n 1 | cut -d'"' -f4)"
          fi

          [ -n "${DART_SASS_VERSION}" ] || die "Failed to resolve the latest Dart Sass version."
        fi

        DART_SASS_VERSION="${DART_SASS_VERSION#v}"

        case "${DART_SASS_VERSION}" in
          ''|*[!0-9A-Za-z.-]*|*..*|-) die "Invalid Dart Sass version: '${DART_SASS_VERSION}'." ;;
        esac

        DART_SASS_FILENAME="dart-sass-${DART_SASS_VERSION}-${OS_NAME}-${ARCH_NAME}${DART_SASS_MUSL}.${FILE_FORMAT}"
        DART_SASS_URL="https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${DART_SASS_FILENAME}"

        #######################################
        # Download
        #######################################

        TMPDIR="$(mktemp -d)"
        cleanup() {
          rm -rf "${TMPDIR}"
        }
        trap cleanup EXIT

        cd "${TMPDIR}"

        note "Downloading ${DART_SASS_FILENAME}."
        download "${DART_SASS_URL}" "${DART_SASS_FILENAME}" \
          || die "Failed to download ${DART_SASS_FILENAME}. Check that Dart Sass ${DART_SASS_VERSION} publishes a build for ${OS_NAME}-${ARCH_NAME}."

        #######################################
        # Verify the archive against GitHub's published SHA-256 digest
        #
        # Dart Sass publishes no checksum file, so the per-asset digest from
        # the GitHub release is the primary verification. GitHub only began
        # attaching digests to release assets in late May 2025 (Dart Sass
        # 1.89.1+), so older releases skip verification without querying the
        # API at all. Setting 'verify-file' to false skips this step entirely.
        #######################################

        # --- BEGIN SHA-256 helpers (also extracted by the digest harness) ---

        # sha256_of FILE -- the file's SHA-256 digest (bare lowercase hex)
        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # verify_sha256 EXPECTED FILE -- prints both digests, fails on mismatch
        verify_sha256() {
          local expected="$1" file="$2" actual
          actual="$(sha256_of "${file}")"
          echo "Expected SHA256: ${expected}"
          echo "Actual SHA256:   ${actual}"
          [ "${expected}" = "${actual}" ]
        }

        # release_asset_sha256 REPO TAG ASSET -- the SHA-256 digest that GitHub
        # publishes for a release asset. Exit status: 0 = digest printed on
        # stdout, 1 = no digest published for that release/asset, 2 = the
        # GitHub API could not be queried.
        release_asset_sha256() {
          local repo="$1" tag="$2" asset="$3" json
          local -a curl_args

          command -v curl >/dev/null 2>&1 || return 2

          curl_args=(-fsSL --retry 2 --connect-timeout 15)
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            curl_args+=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          fi

          json="$(curl "${curl_args[@]}" "https://api.github.com/repos/${repo}/releases/tags/${tag}" 2>/dev/null)" \
            || return 2

          # The API answers with pretty-printed JSON (one field per line), so a
          # small state machine is enough and jq is not needed. Asset objects
          # start with a lone "{" indented by four spaces; within an object the
          # "name" field comes before the "digest" field.
          printf '%s\n' "${json}" | awk -v want="${asset}" '
            { sub(/\r$/, "") }
            $0 == "    {" {
              if (found) { exit }
              found = 0
              digest = ""
              next
            }
            /^ *"name": "/ && !found {
              line = $0
              sub(/^ *"name": "/, "", line)
              sub(/".*$/, "", line)
              if (line == want) { found = 1 }
            }
            /^ *"digest": "sha256:/ && found && digest == "" {
              line = $0
              sub(/^.*"digest": "sha256:/, "", line)
              sub(/".*$/, "", line)
              digest = line
            }
            END {
              if (found && digest != "") { print digest } else { exit 1 }
            }
          ' || return 1
        }

        # --- END SHA-256 helpers ---

        if [ "${DART_SASS_VERIFY_FILE:-true}" != 'true' ]; then
          note "File verification is disabled ('verify-file: false')."
        elif version_ge "${DART_SASS_VERSION}" '1.89.1'; then
          DIGEST_RC=0
          DIGEST_HASH="$(release_asset_sha256 'sass/dart-sass' "${DART_SASS_VERSION}" "${DART_SASS_FILENAME}")" || DIGEST_RC=$?
          case "${DIGEST_RC}" in
            0)
              verify_sha256 "${DIGEST_HASH}" "${DART_SASS_FILENAME}" \
                || die "SHA-256 mismatch for ${DART_SASS_FILENAME} (the digest published in the GitHub release does not match the downloaded archive)."
              note "SHA-256 verification succeeded (GitHub release asset digest)." ;;
            1)
              warn "The GitHub release for Dart Sass ${DART_SASS_VERSION} publishes no SHA-256 digest for ${DART_SASS_FILENAME}; skipping verification." ;;
            *)
              warn "The GitHub API could not be queried for the SHA-256 digest of ${DART_SASS_FILENAME} (network or rate limiting); skipping verification. Pass 'github-token' to avoid API rate limits." ;;
          esac
        else
          warn "Dart Sass ${DART_SASS_VERSION} predates the first release with published SHA-256 asset digests (1.89.1); skipping verification."
        fi

        #######################################
        # Install
        #######################################

        # --- BEGIN install-dir defaults (also extracted by the install-dir harness) ---

        # Windows known folders are looked up through "cygpath -uF" (CSIDL /
        # FOLDERID 38 = Program Files, 42 = Program Files (x86), 28 = Local
        # AppData), so no drive letter or localized folder name is hardcoded.
        # The environment variables are only a fallback for when cygpath is
        # unavailable or does not know a folder.
        win_folder() {
          local id="$1" name="$2" value='' raw=''
          if command -v cygpath >/dev/null 2>&1; then
            value="$(cygpath -uF "${id}" 2>/dev/null || true)"
          fi
          if [ -z "${value}" ]; then
            raw="$(printenv "${name}" 2>/dev/null || true)"
            if [ -z "${raw}" ]; then
              raw="$(printenv "$(printf '%s' "${name}" | tr '[:lower:]' '[:upper:]')" 2>/dev/null || true)"
            fi
            if [ -n "${raw}" ]; then
              if command -v cygpath >/dev/null 2>&1; then
                value="$(cygpath -u "${raw}" 2>/dev/null || true)"
              fi
              [ -n "${value}" ] || value="${raw}"
            fi
          fi
          printf '%s' "${value}"
        }

        # can_install_to DIR -- true when DIR can be created and written to
        # without elevated privileges. mkdir alone is not enough: it also
        # succeeds for an existing directory that is not writable, so probe
        # with a real file write.
        can_install_to() {
          local dir="$1" probe
          mkdir -p "${dir}" 2>/dev/null || return 1
          probe="${dir}/.install-dir-test.$$"
          if ( : > "${probe}" ) 2>/dev/null; then
            rm -f "${probe}" 2>/dev/null || true
            return 0
          fi
          return 1
        }

        # Defaults: /usr/local/bin on Linux and macOS when it is writable
        # without elevation (otherwise ~/.local/bin); Program Files\Dart Sass
        # (or Program Files (x86)\Dart Sass for 32-bit builds) on Windows when
        # writable (otherwise %LOCALAPPDATA%\Programs\Dart Sass). An explicit
        # "~/.local/bin" keeps working as before.
        if [ -z "${INSTALL_DIR}" ]; then
          if [ "${RUNNER_OS}" = 'Windows' ]; then
            WIN_BASE=''
            case "${ARCH_NAME}" in
              ia32) WIN_BASE="$(win_folder 42 'ProgramFiles(x86)')" ;;
            esac
            [ -n "${WIN_BASE}" ] || WIN_BASE="$(win_folder 38 'PROGRAMFILES')"
            if [ -n "${WIN_BASE}" ] && can_install_to "${WIN_BASE}/Dart Sass"; then
              INSTALL_DIR="${WIN_BASE}/Dart Sass"
            else
              WIN_LOCAL="$(win_folder 28 'LOCALAPPDATA')"
              [ -n "${WIN_LOCAL}" ] || WIN_LOCAL="${HOME}/AppData/Local"
              INSTALL_DIR="${WIN_LOCAL}/Programs/Dart Sass"
            fi
          elif { [ "${RUNNER_OS}" = 'Linux' ] || [ "${RUNNER_OS}" = 'macOS' ]; } && can_install_to '/usr/local/bin'; then
            INSTALL_DIR='/usr/local/bin'
          else
            INSTALL_DIR="${HOME}/.local/bin"
          fi
        elif [ "${INSTALL_DIR}" = '~/.local/bin' ]; then
          INSTALL_DIR="${HOME}/.local/bin"
        fi
        if [ "${RUNNER_OS}" = 'Windows' ]; then
          INSTALL_DIR="$(cygpath -u "${INSTALL_DIR}")"
        fi

        # --- END install-dir defaults (also extracted by the install-dir harness) ---

        mkdir -p "${INSTALL_DIR}"

        # Extract into a staging directory first: the archives wrap everything
        # in a top-level "dart-sass/" folder, and only its contents are moved
        # into INSTALL_DIR so that "sass" (or "sass.bat") sits directly there.
        EXTRACT_DIR="${TMPDIR:-/tmp}/dart-sass-extract"
        rm -rf "${EXTRACT_DIR}"
        mkdir -p "${EXTRACT_DIR}"

        if [ "${FILE_FORMAT}" = 'zip' ]; then
          SEVENZIP=''
          if command -v 7z >/dev/null 2>&1; then
            SEVENZIP='7z'
          else
            for WIN_7Z_DIR in "$(win_folder 38 'PROGRAMFILES')" "$(win_folder 42 'ProgramFiles(x86)')"; do
              if [ -n "${WIN_7Z_DIR}" ] && [ -x "${WIN_7Z_DIR}/7-Zip/7z.exe" ]; then
                SEVENZIP="${WIN_7Z_DIR}/7-Zip/7z.exe"
                break
              fi
            done
          fi
          [ -n "${SEVENZIP}" ] || die "7-Zip ('7z') is required to extract ${DART_SASS_FILENAME}."
          "${SEVENZIP}" x "${DART_SASS_FILENAME}" -o"${EXTRACT_DIR}" -y >/dev/null \
            || die "Failed to extract ${DART_SASS_FILENAME}."
        else
          require_cmd tar
          tar -xzf "${DART_SASS_FILENAME}" -C "${EXTRACT_DIR}" \
            || die "Failed to extract ${DART_SASS_FILENAME}."
        fi

        [ -d "${EXTRACT_DIR}/dart-sass" ] \
          || die "Unexpected archive layout: ${DART_SASS_FILENAME} has no top-level 'dart-sass' directory."

        # Copy the contents (not the wrapper directory) into INSTALL_DIR.
        # "cp -R" merges into an existing installation, so re-running the
        # action in the same directory is safe; unlike "cp -a" it does not try
        # to preserve the timestamps of the destination directory, which is not
        # owned by the runner when installing into /usr/local/bin.
        cp -R "${EXTRACT_DIR}/dart-sass/." "${INSTALL_DIR}/" \
          || die "Failed to install ${DART_SASS_FILENAME} into ${INSTALL_DIR}."
        rm -rf "${EXTRACT_DIR}"

        if [ "${OS_NAME}" = 'windows' ]; then
          # The Windows archive ships "sass.bat" only; add a bash wrapper so the
          # same "sass" entry point works in every shell.
          printf '#!/usr/bin/env bash\nexec "$(dirname "$0")/sass.bat" "$@"\n' > "${INSTALL_DIR}/sass"
          chmod +x "${INSTALL_DIR}/sass" "${INSTALL_DIR}/sass.bat" "${INSTALL_DIR}/src/dart.exe"
        else
          chmod +x "${INSTALL_DIR}/sass" "${INSTALL_DIR}/src/dart"
        fi

        #######################################
        # Smoke test
        #######################################

        SASS_BIN="${INSTALL_DIR}/sass"
        [ -f "${SASS_BIN}" ] || die "The Dart Sass launch script was not found at ${SASS_BIN}."
        SMOKE_OUTPUT="$("${SASS_BIN}" --version 2>&1)" \
          || die "The installed Dart Sass binary failed to execute ('sass --version' returned an error)."
        note "Smoke test passed: Dart Sass ${SMOKE_OUTPUT}"

        #######################################
        # Register on PATH and set outputs
        #######################################

        if [ "${RUNNER_OS}" = 'Windows' ]; then
          DART_SASS_PATH="$(cygpath -w "${INSTALL_DIR}/sass.bat")"
          PATH_ENTRY="$(cygpath -w "${INSTALL_DIR}")"
        else
          DART_SASS_PATH="${INSTALL_DIR}/sass"
          PATH_ENTRY="${INSTALL_DIR}"
        fi

        # In bash on Windows runners $PATH is still colon separated (MSYS
        # style), so always split on ':' but write the native path format to
        # GITHUB_PATH for the runner to consume.
        if ! printf '%s' "${PATH}" | tr ':' '\n' | grep -Fqx "${INSTALL_DIR}"; then
          printf '%s\n' "${PATH_ENTRY}" >> "${GITHUB_PATH}"
        fi

        echo "dart-sass-version=${DART_SASS_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "dart-sass-path=${DART_SASS_PATH}" >> "${GITHUB_OUTPUT}"

        echo "Dart Sass ${DART_SASS_VERSION} installed at ${DART_SASS_PATH}"
