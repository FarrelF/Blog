name: 'Setup Dart Sass'
description: 'Download and install the Dart Sass CLI binary in GitHub Actions'
inputs:
  dart-sass-version:
    description: 'Dart Sass version to install. "latest" resolves the newest release via the GitHub API.'
    required: false
    default: 'latest'
  is-musl:
    description: 'Install the musl build (Linux only) (true/false)'
    required: false
    default: 'false'
  install-dir:
    description: 'Directory to install Dart Sass to'
    required: false
    default: '~/.local/bin'
  downloader:
    description: 'Downloader to use for fetching the Dart Sass binary (curl, wget or aria2/2c)'
    required: false
    default: 'aria2'
  downloader-args:
    description: 'Arguments to pass to the downloader'
    required: false
    default: ''
  github-token:
    description: 'Token used to query the GitHub API when resolving "latest" (avoids rate limiting). Pass secrets.GITHUB_TOKEN from the caller workflow.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install Dart Sass
      shell: bash
      env:
        DART_SASS_VERSION: ${{ inputs.dart-sass-version }}
        IS_MUSL: ${{ inputs.is-musl }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        DOWNLOADER: ${{ inputs.downloader }}
        DOWNLOADER_ARGS: ${{ inputs.downloader-args }}
      run: |
        # Detect OS and system architecture with Go standard environment variables
        case "${RUNNER_OS}" in
          "Linux") OS_NAME="linux" ;;
          "macOS") OS_NAME="macos" ;;
          "Windows") OS_NAME="windows" ;;
        esac

        case "${RUNNER_ARCH}" in
          "X64") ARCH_NAME="x64" ;;
          "X86") ARCH_NAME="x86" ;;
          "ARM64") ARCH_NAME="arm64" ;;
          "ARM") ARCH_NAME="arm" ;;
        esac

        # Setup downloader command and arguments
        DOWNLOADER_CMD=${DOWNLOADER}

        if [ "${DOWNLOADER}" = "aria2" ]; then
          DOWNLOADER_CMD=aria2c
        fi

        if [ -z "${DOWNLOADER_ARGS}" ]; then
          case "${DOWNLOADER_CMD}" in
            aria2c) DOWNLOADER_ARGS="-c -x16 -s16 -j16 -U 'Mozilla/5.0'" ;;
            curl) DOWNLOADER_ARGS="-C - -A 'Mozilla/5.0' -LO" ;;
            wget) DOWNLOADER_ARGS="-c -U 'Mozilla/5.0'" ;;
            axel) DOWNLOADER_ARGS="-a -n 16 -U 'Mozilla/5.0'" ;;
            mwget) DOWNLOADER_ARGS="-n 16 -c -U 'Mozilla/5.0'" ;;
          esac
        fi

        # Set file format
        if [ "$OS_NAME" = "windows" ]; then
          FILE_FORMAT="zip"
        else
          FILE_FORMAT="tar.gz"
        fi

        # Handle MUSL Build for Linux
        if [ "${IS_MUSL:-false}" = true ] && [ "$OS_NAME" = "linux" ]; then
          DART_SASS_MUSL="-musl"
        else
          DART_SASS_MUSL=""
        fi

        # Use latest version if DART_SASS_VERSION=latest or if not specified
        if [ "${DART_SASS_VERSION:-}" = "latest" ] || [ -z "${DART_SASS_VERSION:-}" ]; then
          if [ -z "${DART_SASS_VERSION:-}" ]; then
            echo "NOTE: No Dart Sass version specified in \$DART_SASS_VERSION."
            echo "Using the latest release instead."
          fi

          if [ -n "${GITHUB_TOKEN:-}" ]; then
            DART_SASS_VERSION="$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/sass/dart-sass/releases/latest | jq -r .tag_name)"
          else
            DART_SASS_VERSION="$(curl -s https://api.github.com/repos/sass/dart-sass/releases/latest | jq -r .tag_name)"
          fi
        fi

        # Set filename
        DART_SASS_FILENAME="dart-sass-${DART_SASS_VERSION}-${OS_NAME}-${ARCH_NAME}${DART_SASS_MUSL}.${FILE_FORMAT}"

        # Make a temporary folder for downloaded and extracted files
        TMPDIR="$(mktemp -d)"; cd "${TMPDIR}"

        # Download with error handling
        "${DOWNLOADER_CMD}" "${DOWNLOADER_ARGS}" https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${DART_SASS_FILENAME} \
        || { echo "Download failed"; exit 1; }

        # Make directory for Dart Sass files
        if [ "${INSTALL_DIR}" = "~/.local/bin" ]; then
          INSTALL_DIR="${HOME}/.local/bin"
        fi

        if test ! -d "${INSTALL_DIR}"; then
          mkdir -p "${INSTALL_DIR}"
        fi

        # Extract downloaded file
        if [ "$FILE_FORMAT" = "zip" ]; then
          # Use 7z to extract zip file
          7z x "${DART_SASS_FILENAME}" -o"${INSTALL_DIR}" -y
        else
          tar -xzf "${DART_SASS_FILENAME}" -C "${INSTALL_DIR}"
        fi

        # Install Dart Sass
        if [ "$OS_NAME" = "windows" ]; then
          echo '#!/usr/bin/env bash' > "${INSTALL_DIR}/dart-sass/sass"
          echo 'exec "$(dirname "$0")/sass.bat" "$@"' >> "${INSTALL_DIR}/dart-sass/sass"
          chmod +x "${INSTALL_DIR}/dart-sass/sass"
          chmod +x "${INSTALL_DIR}/dart-sass/sass.bat"
          chmod +x "${INSTALL_DIR}/dart-sass/src/dart.exe"
        else
          chmod +x "${INSTALL_DIR}/dart-sass/sass"
          chmod +x "${INSTALL_DIR}/dart-sass/src/dart"
        fi

        if ! echo "$PATH" | tr ':' '\n' | grep -Fxq "${INSTALL_DIR}/dart-sass"; then
          echo "${INSTALL_DIR}/dart-sass" >> "${GITHUB_PATH}"
        fi

        cd "${GITHUB_WORKSPACE}" || exit
        rm -rf "${TMPDIR}"
