name: 'Setup Hugo'
description: 'Download and install any official Hugo release (v0.7.0 through the latest; standard, Deploy or the historical Extended editions) on Linux, macOS, Windows, Termux/Android, FreeBSD, OpenBSD, NetBSD, DragonFly BSD and Solaris/illumos through scripts/install-hugo.sh, verified against the official checksum files, falling back to the SHA-256 digest published in the GitHub release'
inputs:
  hugo-version:
    description: 'Hugo version to install, with or without the "v" prefix (e.g. "0.168.0" or "v0.168.0"). Any official release from v0.7.0 to the latest is supported, except on macOS 15+ runners, where releases before v0.48.0 are refused (their Go 1.10-and-older runtime cannot execute there). "latest" resolves the newest release.'
    required: false
    default: 'latest'
  verify-file:
    description: 'Verify the downloaded archive against the official checksum file (true/false). When the checksum file is unavailable or has no entry for the asset, the SHA-256 digest published in the GitHub release (v0.147.7+) is used as a fallback. When nothing can verify the archive (older releases, or the API is unreachable), verification is skipped with a warning; a mismatching checksum or digest always fails the step.'
    required: false
    default: 'true'
  extended:
    description: 'Install the Hugo Extended build (true/false). Extended builds are published from v0.43.0 through v0.169.x; v0.170.0 removed the Extended edition, so from v0.170.0 this input is accepted for backward compatibility and the equivalent standard build is installed. On unsupported platforms the standard build is installed with a warning.'
    required: false
    default: 'false'
  with-deploy:
    description: 'Install Hugo with the Deploy feature (true/false). From v0.170.0 this installs the "withdeploy" build. Before v0.170.0 it means Extended+Deploy when "extended" is also true (v0.137.0+; Linux ARM64 from v0.139.0, Windows from v0.137.1) and standard+Deploy from v0.159.2; Hugo Extended v0.56.0-v0.136.x bundle Deploy already.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to query the GitHub API when resolving "latest" fails via the releases redirect and when fetching the SHA-256 digest used for verification (avoids rate limiting). Pass secrets.GITHUB_TOKEN from the caller workflow.'
    required: false
    default: ''
  install-dir:
    description: 'Directory that receives the "hugo" binary. Defaults to "/usr/local/bin" when it is writable or reachable through root, passwordless sudo/doas, or pfexec (otherwise "~/.local/bin" in non-interactive runs), to "C:\Program Files\Hugo" (64-bit) or "C:\Program Files (x86)\Hugo" (32-bit) on Windows when writable (otherwise "%LOCALAPPDATA%\Programs\Hugo"), to "$PREFIX/bin" or "~/.local/bin" on Termux, and on Solaris to "/usr/local/bin" or "/opt/local/bin" only when the prefix already exists. For macOS ".pkg" assets the package is expanded without elevation; when expansion fails it is installed through the planned escalation into "/usr/local/bin". An explicit directory never falls back silently.'
    required: false
    default: ''
  manpages:
    description: 'Generate and install Hugo manpages (true/false). Manpages are gzipped and installed under <share-dir>/man/man1; when gzip is unavailable the manpages are skipped. The standalone script enables manpages by default, but this action defaults to false so CI builds stay lean. Default: false.'
    required: false
    default: 'false'
  completions:
    description: 'Shell completions to install: "auto" (only the supported shells detected on the runner), "none", a comma-separated subset of bash, fish, zsh, and powershell, or "all". The standalone script defaults to auto, but this action defaults to none so CI builds stay lean. Default: none.'
    required: false
    default: 'none'
  share-dir:
    description: 'Directory that receives manpages and completion data. Defaults to <prefix>/share when that directory is writable or the binary was installed through sudo/doas/pfexec (for example /usr/local/share for /usr/local/bin); the extras reuse that escalation in one privileged batch. Otherwise it uses ~/.local/share. A failed privileged extras write falls back to ~/.local/share without failing the install, but an explicit share-dir never falls back silently. User-local installs print the MANPATH, fpath, or $PROFILE line to add.'
    required: false
    default: ''
  downloader:
    description: 'Downloader to use for Hugo (auto, curl, wget, aria2/2c or axel). "auto" prefers aria2c, then curl, then wget.'
    required: false
    default: 'aria2'
  downloader-args:
    description: 'Arguments to pass to the downloader (word-split, so avoid embedded spaces)'
    required: false
    default: ''
outputs:
  hugo-version:
    description: 'The Hugo version that was actually installed (without the "v" prefix)'
    value: ${{ steps.install-hugo.outputs.hugo-version }}
  hugo-path:
    description: 'Path to the installed Hugo binary'
    value: ${{ steps.install-hugo.outputs.hugo-path }}
runs:
  using: 'composite'
  steps:
    - name: Install Hugo
      id: install-hugo
      shell: bash
      env:
        HUGO_VERSION: ${{ inputs.hugo-version }}
        HUGO_VERIFY: ${{ inputs.verify-file }}
        HUGO_EXTENDED: ${{ inputs.extended }}
        HUGO_WITHDEPLOY: ${{ inputs.with-deploy }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HUGO_INSTALL_DIR: ${{ inputs.install-dir }}
        HUGO_MANPAGES: ${{ inputs.manpages }}
        HUGO_COMPLETIONS: ${{ inputs.completions }}
        HUGO_SHARE_DIR: ${{ inputs.share-dir }}
        DOWNLOADER: ${{ inputs.downloader }}
        DOWNLOADER_ARGS: ${{ inputs.downloader-args }}
      run: |
        script="${GITHUB_ACTION_PATH}/../../../scripts/install-hugo.sh"
        case "$(uname -s)" in
          MINGW* | MSYS* | CYGWIN*) script="$(cygpath -u "${script}")" ;;
        esac
        sh "${script}"
