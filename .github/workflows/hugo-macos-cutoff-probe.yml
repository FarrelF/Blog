name: Hugo macOS Cutoff Probe

# Temporary workflow: determines the oldest macOS Hugo build (v0.16-v0.102)
# that still executes natively on the macos-15-intel runner. Delete this file
# once the cutoff has been recorded in the setup-hugo README.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe old Hugo binaries on macOS 15 Intel
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Report environment
        shell: bash
        run: |
          sw_vers
          uname -m

      - name: Probe binaries
        shell: bash
        run: |
          set -u
          workdir="$RUNNER_TEMP/cutoff-probe"
          mkdir -p "$workdir"
          cd "$workdir"
          cat > versions.txt <<'VERSIONS'
          v0.16 hugo_0.16_osx-64bit.tgz
          v0.18 hugo_0.18_macOS-64bit.zip
          v0.19 hugo_0.19_macOS-64bit.zip
          v0.20.3 hugo_v0.20.3_macOS-64bit.tar.gz
          v0.22 hugo_0.22_macOS-64bit.tar.gz
          v0.25.1 hugo_0.25.1_macOS-64bit.tar.gz
          v0.28 hugo_0.28_macOS-64bit.tar.gz
          v0.31 hugo_0.31_macOS-64bit.tar.gz
          v0.34 hugo_0.34_macOS-64bit.tar.gz
          v0.37 hugo_0.37_macOS-64bit.tar.gz
          v0.40.3 hugo_0.40.3_macOS-64bit.tar.gz
          v0.43 hugo_0.43_macOS-64bit.tar.gz
          v0.46 hugo_0.46_macOS-64bit.tar.gz
          v0.49.2 hugo_0.49.2_macOS-64bit.tar.gz
          v0.53 hugo_0.53_macOS-64bit.tar.gz
          v0.54.0 hugo_0.54.0_macOS-64bit.tar.gz
          v0.55.6 hugo_0.55.6_macOS-64bit.tar.gz
          v0.56.0 hugo_0.56.0_macOS-64bit.tar.gz
          v0.56.3 hugo_0.56.3_macOS-64bit.tar.gz
          v0.57.2 hugo_0.57.2_macOS-64bit.tar.gz
          v0.58.0 hugo_0.58.0_macOS-64bit.tar.gz
          v0.58.3 hugo_0.58.3_macOS-64bit.tar.gz
          v0.59.1 hugo_0.59.1_macOS-64bit.tar.gz
          v0.60.1 hugo_0.60.1_macOS-64bit.tar.gz
          v0.61.0 hugo_0.61.0_macOS-64bit.tar.gz
          v0.62.2 hugo_0.62.2_macOS-64bit.tar.gz
          v0.64.1 hugo_0.64.1_macOS-64bit.tar.gz
          v0.66.0 hugo_0.66.0_macOS-64bit.tar.gz
          v0.68.3 hugo_0.68.3_macOS-64bit.tar.gz
          v0.70.0 hugo_0.70.0_macOS-64bit.tar.gz
          v0.72.0 hugo_0.72.0_macOS-64bit.tar.gz
          v0.74.3 hugo_0.74.3_macOS-64bit.tar.gz
          v0.76.5 hugo_0.76.5_macOS-64bit.tar.gz
          v0.78.2 hugo_0.78.2_macOS-64bit.tar.gz
          v0.80.0 hugo_0.80.0_macOS-64bit.tar.gz
          v0.82.1 hugo_0.82.1_macOS-64bit.tar.gz
          v0.84.4 hugo_0.84.4_macOS-64bit.tar.gz
          v0.86.1 hugo_0.86.1_macOS-64bit.tar.gz
          v0.88.1 hugo_0.88.1_macOS-64bit.tar.gz
          v0.90.1 hugo_0.90.1_macOS-64bit.tar.gz
          v0.95.0 hugo_0.95.0_macOS-64bit.tar.gz
          v0.100.0 hugo_0.100.0_macOS-64bit.tar.gz
          v0.101.0 hugo_0.101.0_macOS-64bit.tar.gz
          v0.102.3 hugo_0.102.3_macOS-universal.tar.gz
          VERSIONS

          first() { printf '%s' "$1" | head -n 1 | tr -d '\r' | cut -c1-120; }

          while read -r tag asset; do
            [ -z "$tag" ] && continue
            echo "== $tag ($asset)"
            dir="$workdir/$tag"
            mkdir -p "$dir/x"
            url="https://github.com/gohugoio/hugo/releases/download/$tag/$asset"
            if ! curl -fsSL --retry 3 -o "$dir/$asset" "$url"; then
              echo "RESULT $tag: DOWNLOAD-FAILED"
              continue
            fi
            case "$asset" in
              *.zip) unzip -qo "$dir/$asset" -d "$dir/x" >/dev/null 2>&1 || true ;;
              *) tar xzf "$dir/$asset" -C "$dir/x" >/dev/null 2>&1 || true ;;
            esac
            bin="$(find "$dir/x" -type f -name 'hugo*' -size +1M | head -n 1)"
            if [ -z "$bin" ]; then
              echo "RESULT $tag: NO-BINARY"
              continue
            fi
            chmod +x "$bin" 2>/dev/null || true

            out_v="$("$bin" version 2>&1)"; rc_v=$?
            out_h="$("$bin" -h 2>&1)"; rc_h=$?

            if [ $rc_v -eq 0 ] && printf '%s' "$out_v" | grep -qi hugo; then
              echo "RESULT $tag: RUNS :: $(first "$out_v")"
              continue
            fi
            if printf '%s' "$out_h" | grep -qi 'usage: hugo'; then
              echo "RESULT $tag: RUNS-HELP :: $(first "$out_h")"
              continue
            fi

            echo "RESULT $tag: FAILS :: version rc=$rc_v [$(first "$out_v")] help rc=$rc_h [$(first "$out_h")]"
            sig="$(codesign -dv "$bin" 2>&1 | head -n 2 | tr '\n' ' ')"
            echo "SIGNINFO $tag: ${sig:-codesign produced no output}"
            if codesign --force --sign - "$bin" >/dev/null 2>&1; then
              out_r="$("$bin" version 2>&1)"; rc_r=$?
              if [ $rc_r -eq 0 ] && printf '%s' "$out_r" | grep -qi hugo; then
                echo "RESIGN $tag: RUNS :: $(first "$out_r")"
              else
                echo "RESIGN $tag: STILL-FAILS :: rc=$rc_r"
              fi
            else
              echo "RESIGN $tag: CODESIGN-FAILED"
            fi
          done < versions.txt
          echo "PROBE-DONE"
