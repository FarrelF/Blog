name: Hugo macOS Cutoff Probe

# Temporary workflow: checks whether pre-v0.48 Hugo binaries (Go <= 1.10) also
# fail on the macOS 15 ARM64 runner (x86_64 asset under Rosetta 2), so the
# upcoming macOS guard in setup-hugo can cover both architectures correctly.
# Delete this file once the result is recorded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe old Hugo binaries on macOS 15 ARM64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Report environment
        shell: bash
        run: |
          sw_vers
          uname -m

      - name: Probe binaries
        shell: bash
        run: |
          set -u
          workdir="$RUNNER_TEMP/cutoff-probe"
          mkdir -p "$workdir"
          cd "$workdir"
          cat > versions.txt <<'VERSIONS'
          v0.16 hugo_0.16_osx-64bit.tgz
          v0.46 hugo_0.46_macOS-64bit.tar.gz
          v0.47.1 hugo_0.47.1_macOS-64bit.tar.gz
          v0.48 hugo_0.48_macOS-64bit.tar.gz
          v0.88.1 hugo_0.88.1_macOS-64bit.tar.gz
          VERSIONS

          first() { printf '%s' "$1" | head -n 1 | tr -d '\r' | cut -c1-120; }

          while read -r tag asset; do
            [ -z "$tag" ] && continue
            echo "== $tag ($asset)"
            dir="$workdir/$tag"
            mkdir -p "$dir/x"
            url="https://github.com/gohugoio/hugo/releases/download/$tag/$asset"
            if ! curl -fsSL --retry 3 -o "$dir/$asset" "$url"; then
              echo "RESULT $tag: DOWNLOAD-FAILED"
              continue
            fi
            case "$asset" in
              *.zip) unzip -qo "$dir/$asset" -d "$dir/x" >/dev/null 2>&1 || true ;;
              *) tar xzf "$dir/$asset" -C "$dir/x" >/dev/null 2>&1 || true ;;
            esac
            bin="$(find "$dir/x" -type f -name 'hugo*' -size +1M | head -n 1)"
            if [ -z "$bin" ]; then
              echo "RESULT $tag: NO-BINARY"
              continue
            fi
            chmod +x "$bin" 2>/dev/null || true

            rc_v=0; out_v="$("$bin" version 2>&1)" || rc_v=$?
            rc_h=0; out_h="$("$bin" -h 2>&1)" || rc_h=$?

            if [ $rc_v -eq 0 ] && printf '%s' "$out_v" | grep -qi hugo; then
              echo "RESULT $tag: RUNS :: $(first "$out_v")"
              continue
            fi
            if printf '%s' "$out_h" | grep -qi 'usage: hugo'; then
              echo "RESULT $tag: RUNS-HELP :: $(first "$out_h")"
              continue
            fi

            echo "RESULT $tag: FAILS :: version rc=$rc_v [$(first "$out_v")] help rc=$rc_h [$(first "$out_h")]"
            sig="$(codesign -dv "$bin" 2>&1 | head -n 2 | tr '\n' ' ' || true)"
            echo "SIGNINFO $tag: ${sig:-codesign produced no output}"
            if codesign --force --sign - "$bin" >/dev/null 2>&1; then
              rc_r=0; out_r="$("$bin" version 2>&1)" || rc_r=$?
              if [ $rc_r -eq 0 ] && printf '%s' "$out_r" | grep -qi hugo; then
                echo "RESIGN $tag: RUNS :: $(first "$out_r")"
              else
                echo "RESIGN $tag: STILL-FAILS :: rc=$rc_r"
              fi
            else
              echo "RESIGN $tag: CODESIGN-FAILED"
            fi
          done < versions.txt
          echo "PROBE-DONE"
