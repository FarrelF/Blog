name: Action Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/setup-hugo/**'
      - '.github/actions/setup-dart-sass/**'
      - '.github/workflows/action-tests.yml'
      - 'scripts/install-hugo.sh'
      - 'scripts/install-dart-sass.sh'
      - 'scripts/install-hugo.ps1'
      - 'scripts/install-dart-sass.ps1'
      - 'scripts/tests/**'

permissions:
  contents: read

jobs:
  hugo-linux:
    name: Hugo / Ubuntu / ${{ matrix.version }} / ${{ matrix.edition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '0.7',    edition: 'standard' }
          - { version: '0.8',    edition: 'standard' }
          - { version: '0.9',    edition: 'standard' }
          - { version: '0.15',   edition: 'standard' }
          - { version: '0.16',   edition: 'standard' }
          - { version: '0.17',   edition: 'standard' }
          - { version: '0.20.3', edition: 'standard' }
          - { version: '0.26',   edition: 'standard', downloader: 'curl', verify: 'false' }
          - { version: '0.27',   edition: 'standard' }
          - { version: '0.43',   edition: 'extended' }
          - { version: '0.55.6', edition: 'extended' }
          - { version: '0.56.0', edition: 'extended' }
          - { version: '0.102.3', edition: 'standard' }
          - { version: '0.103.0', edition: 'standard' }
          - { version: '0.137.0', edition: 'extended-with-deploy' }
          - { version: '0.159.2', edition: 'with-deploy' }
          - { version: '0.169.0', edition: 'extended-with-deploy', expect: '+extended+withdeploy' }
          - { version: '0.170.0', edition: 'extended', reject: '+extended' }
          - { version: '0.170.0', edition: 'with-deploy', expect: '+withdeploy' }
          - { version: '0.170.0', edition: 'extended-with-deploy', expect: '+withdeploy', reject: '+extended' }
          - { version: 'latest', edition: 'extended-with-deploy', expect: '+withdeploy' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        id: hugo
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: ${{ matrix.version }}
          verify-file: ${{ matrix.verify || 'true' }}
          extended: ${{ contains(matrix.edition, 'extended') }}
          with-deploy: ${{ contains(matrix.edition, 'deploy') }}
          downloader: ${{ matrix.downloader || 'aria2' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Hugo
        shell: bash
        run: |
          set -euo pipefail
          echo "output hugo-version: ${{ steps.hugo.outputs.hugo-version }}"
          echo "output hugo-path:    ${{ steps.hugo.outputs.hugo-path }}"
          test -x "${{ steps.hugo.outputs.hugo-path }}"
          # Default install-dir on Linux is /usr/local/bin; GitHub-hosted
          # Ubuntu runners can write there without elevation.
          echo "${{ steps.hugo.outputs.hugo-path }}" | grep -qF '/usr/local/bin/hugo'
          # v0.7/v0.8 print help with a non-zero exit code even though the
          # binary works; it was already smoke tested by the action.
          HUGO_VERSION_LINE="$(hugo version 2>/dev/null || true)"
          if [ -z "${HUGO_VERSION_LINE}" ]; then
            HUGO_VERSION_LINE="$(hugo -h 2>&1 | head -n 1 || true)"
          fi
          printf '%s\n' "${HUGO_VERSION_LINE}"
          # Edition assertions ("expect"/"reject") pin the Hugo v0.170.0
          # edition change: Extended is gone, Deploy lives in the standard
          # "withdeploy" build, and the hugo_extended_* aliases are never used.
          if [ -n "${{ matrix.expect || '' }}" ]; then
            if ! printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.expect }}"; then
              echo "::error::Expected '${{ matrix.expect }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi
          if [ -n "${{ matrix.reject || '' }}" ]; then
            if printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.reject }}"; then
              echo "::error::Did not expect '${{ matrix.reject }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi

  hugo-windows:
    name: Hugo / Windows / ${{ matrix.version }} / ${{ matrix.edition }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '0.7',    edition: 'standard' }
          - { version: '0.9',    edition: 'standard' }
          - { version: '0.15',   edition: 'standard' }
          - { version: '0.17',   edition: 'standard' }
          - { version: '0.20.3', edition: 'standard' }
          - { version: '0.103.0', edition: 'standard' }
          - { version: '0.137.0', edition: 'extended-with-deploy' }   # bumped to v0.137.1 (Windows archive was missing)
          - { version: '0.169.0', edition: 'extended-with-deploy', expect: '+extended+withdeploy' }
          - { version: '0.170.0', edition: 'extended-with-deploy', expect: '+withdeploy', reject: '+extended' }
          - { version: 'latest', edition: 'extended', reject: '+extended' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        id: hugo
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: ${{ matrix.version }}
          verify-file: true
          extended: ${{ contains(matrix.edition, 'extended') }}
          with-deploy: ${{ contains(matrix.edition, 'deploy') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Hugo
        shell: bash
        run: |
          set -euo pipefail
          echo "output hugo-version: ${{ steps.hugo.outputs.hugo-version }}"
          echo "output hugo-path:    ${{ steps.hugo.outputs.hugo-path }}"
          test -f "${{ steps.hugo.outputs.hugo-path }}"
          # Default install-dir on Windows is C:\Program Files\Hugo (the
          # GitHub-hosted runner is elevated, so the primary is writable).
          echo "${{ steps.hugo.outputs.hugo-path }}" | grep -qF '\Program Files\Hugo\hugo.exe'
          # v0.7/v0.8 print help with a non-zero exit code even though the
          # binary works; it was already smoke tested by the action.
          HUGO_VERSION_LINE="$(hugo version 2>/dev/null || true)"
          if [ -z "${HUGO_VERSION_LINE}" ]; then
            HUGO_VERSION_LINE="$(hugo -h 2>&1 | head -n 1 || true)"
          fi
          printf '%s\n' "${HUGO_VERSION_LINE}"
          # Edition assertions ("expect"/"reject") pin the Hugo v0.170.0
          # edition change: Extended is gone, Deploy lives in the standard
          # "withdeploy" build, and the hugo_extended_* aliases are never used.
          if [ -n "${{ matrix.expect || '' }}" ]; then
            if ! printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.expect }}"; then
              echo "::error::Expected '${{ matrix.expect }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi
          if [ -n "${{ matrix.reject || '' }}" ]; then
            if printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.reject }}"; then
              echo "::error::Did not expect '${{ matrix.reject }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi

  hugo-macos-arm64:
    name: Hugo / macOS ARM64 / ${{ matrix.version }} / ${{ matrix.edition }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '0.88.0', edition: 'standard' }               # no native ARM64 build; Intel fallback
          - { version: '0.102.3', edition: 'extended' }              # macOS-universal era
          - { version: '0.152.2', edition: 'extended', expect: '+extended' }  # last darwin-universal.tar.gz
          - { version: '0.153.0', edition: 'standard', pkg: true }              # first darwin-universal.pkg
          - { version: '0.170.0', edition: 'extended', reject: '+extended', pkg: true }  # Extended was removed; no macOS extended asset
          - { version: 'latest', edition: 'extended-with-deploy', expect: '+withdeploy', reject: '+extended', pkg: true }   # current .pkg
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        id: hugo
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: ${{ matrix.version }}
          verify-file: true
          extended: ${{ contains(matrix.edition, 'extended') }}
          with-deploy: ${{ contains(matrix.edition, 'deploy') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Hugo
        shell: bash
        run: |
          set -euo pipefail
          echo "output hugo-version: ${{ steps.hugo.outputs.hugo-version }}"
          echo "output hugo-path:    ${{ steps.hugo.outputs.hugo-path }}"
          test -x "${{ steps.hugo.outputs.hugo-path }}"
          # From v0.153.0 the macOS asset is a .pkg, which installs into
          # /usr/local/bin. Non-.pkg assets follow the Linux default:
          # /usr/local/bin when writable, otherwise ~/.local/bin.
          if [ "${{ matrix.pkg || '' }}" = 'true' ]; then
            # .pkg assets install into /usr/local/bin when the runner can
            # write there; the script falls back to ~/.local/bin otherwise.
            case "${{ steps.hugo.outputs.hugo-path }}" in
              /usr/local/bin/hugo | "${HOME}/.local/bin/hugo") ;;
              *)
                echo "::error::Unexpected .pkg install path: ${{ steps.hugo.outputs.hugo-path }}"
                exit 1
                ;;
            esac
          elif mkdir -p '/usr/local/bin' 2>/dev/null && ( : > "/usr/local/bin/.install-dir-test.$$" ) 2>/dev/null; then
            rm -f "/usr/local/bin/.install-dir-test.$$"
            test "${{ steps.hugo.outputs.hugo-path }}" = '/usr/local/bin/hugo'
          else
            test "${{ steps.hugo.outputs.hugo-path }}" = "${HOME}/.local/bin/hugo"
          fi
          # v0.7/v0.8 print help with a non-zero exit code even though the
          # binary works; it was already smoke tested by the action.
          HUGO_VERSION_LINE="$(hugo version 2>/dev/null || true)"
          if [ -z "${HUGO_VERSION_LINE}" ]; then
            HUGO_VERSION_LINE="$(hugo -h 2>&1 | head -n 1 || true)"
          fi
          printf '%s\n' "${HUGO_VERSION_LINE}"
          # Edition assertions ("expect"/"reject") pin the Hugo v0.170.0
          # edition change: Extended is gone, Deploy lives in the standard
          # "withdeploy" build, and the hugo_extended_* aliases are never used.
          if [ -n "${{ matrix.expect || '' }}" ]; then
            if ! printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.expect }}"; then
              echo "::error::Expected '${{ matrix.expect }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi
          if [ -n "${{ matrix.reject || '' }}" ]; then
            if printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.reject }}"; then
              echo "::error::Did not expect '${{ matrix.reject }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi

  hugo-macos-intel:
    name: Hugo / macOS Intel / ${{ matrix.version }} / ${{ matrix.edition }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          # Releases below v0.48 are covered by hugo-macos-intel-expected-gap:
          # binaries built with Go 1.10 and older do not execute on modern macOS runners.
          - { version: '0.48', edition: 'standard' }                # oldest release that executes on macOS 15 (Go 1.11)
          - { version: '0.103.0', edition: 'standard' }
          - { version: '0.152.2', edition: 'standard' }
          - { version: '0.169.0', edition: 'extended', expect: '+extended', pkg: true }
          - { version: 'latest', edition: 'extended', reject: '+extended', pkg: true }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        id: hugo
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: ${{ matrix.version }}
          verify-file: true
          extended: ${{ contains(matrix.edition, 'extended') }}
          with-deploy: ${{ contains(matrix.edition, 'deploy') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Hugo
        shell: bash
        run: |
          set -euo pipefail
          echo "output hugo-version: ${{ steps.hugo.outputs.hugo-version }}"
          echo "output hugo-path:    ${{ steps.hugo.outputs.hugo-path }}"
          test -x "${{ steps.hugo.outputs.hugo-path }}"
          # v0.153.0+ ships .pkg assets, which install into /usr/local/bin.
          # Older archives follow the Linux default: /usr/local/bin when
          # writable, otherwise ~/.local/bin.
          if [ "${{ matrix.pkg || '' }}" = 'true' ]; then
            # .pkg assets install into /usr/local/bin when the runner can
            # write there; the script falls back to ~/.local/bin otherwise.
            case "${{ steps.hugo.outputs.hugo-path }}" in
              /usr/local/bin/hugo | "${HOME}/.local/bin/hugo") ;;
              *)
                echo "::error::Unexpected .pkg install path: ${{ steps.hugo.outputs.hugo-path }}"
                exit 1
                ;;
            esac
          elif mkdir -p '/usr/local/bin' 2>/dev/null && ( : > "/usr/local/bin/.install-dir-test.$$" ) 2>/dev/null; then
            rm -f "/usr/local/bin/.install-dir-test.$$"
            test "${{ steps.hugo.outputs.hugo-path }}" = '/usr/local/bin/hugo'
          else
            test "${{ steps.hugo.outputs.hugo-path }}" = "${HOME}/.local/bin/hugo"
          fi
          # v0.7/v0.8 print help with a non-zero exit code even though the
          # binary works; it was already smoke tested by the action.
          HUGO_VERSION_LINE="$(hugo version 2>/dev/null || true)"
          if [ -z "${HUGO_VERSION_LINE}" ]; then
            HUGO_VERSION_LINE="$(hugo -h 2>&1 | head -n 1 || true)"
          fi
          printf '%s\n' "${HUGO_VERSION_LINE}"
          # Edition assertions ("expect"/"reject") pin the Hugo v0.170.0
          # edition change: Extended is gone, Deploy lives in the standard
          # "withdeploy" build, and the hugo_extended_* aliases are never used.
          if [ -n "${{ matrix.expect || '' }}" ]; then
            if ! printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.expect }}"; then
              echo "::error::Expected '${{ matrix.expect }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi
          if [ -n "${{ matrix.reject || '' }}" ]; then
            if printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.reject }}"; then
              echo "::error::Did not expect '${{ matrix.reject }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi

  # Pre-v0.48 builds (Go 1.10 and older) cannot execute on macOS 15+;
  # setup-hugo refuses them up front on those runners (both architectures).
  hugo-macos-intel-expected-gap:
    name: Hugo / macOS Intel / ${{ matrix.version }} / expected gap
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '0.16' }    # Go 1.6.2
          - { version: '0.18' }    # Go 1.7.4
          - { version: '0.47.1' }  # Go 1.10.3 (last failing release)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo (expected to fail)
        id: hugo
        continue-on-error: true
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: ${{ matrix.version }}
          verify-file: true

      - name: Assert the action refused the build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.hugo.outcome }}" != 'failure' ]; then
            echo "::error::Expected the action to refuse Hugo v${{ matrix.version }} on macOS Intel (Go 1.10 and older builds cannot execute on macOS 15+)"
            exit 1
          fi
          echo "Action refused v${{ matrix.version }} on macOS Intel as expected."

  hugo-macos-arm64-expected-gap:
    name: Hugo / macOS ARM64 / v0.47.1 / expected gap
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo (expected to fail)
        id: hugo
        continue-on-error: true
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: '0.47.1'
          verify-file: true

      - name: Assert the action refused the build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.hugo.outcome }}" != 'failure' ]; then
            echo "::error::Expected the action to refuse Hugo v0.47.1 on macOS ARM64 (Go 1.10 and older builds cannot execute on macOS 15+)"
            exit 1
          fi
          echo "Action refused v0.47.1 on macOS ARM64 as expected."

  hugo-linux-arm64:
    name: Hugo / Ubuntu ARM64 / ${{ matrix.version }} / ${{ matrix.edition }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '0.100.0', edition: 'extended' }             # no ARM64 extended build; standard fallback
          - { version: '0.169.0', edition: 'extended-with-deploy', expect: '+extended+withdeploy' }
          - { version: '0.170.0', edition: 'extended-with-deploy', expect: '+withdeploy', reject: '+extended' }
          - { version: 'latest', edition: 'extended-with-deploy', expect: '+withdeploy' }  # native ARM64 withdeploy
          - { version: 'latest', edition: 'standard' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        id: hugo
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: ${{ matrix.version }}
          verify-file: true
          extended: ${{ contains(matrix.edition, 'extended') }}
          with-deploy: ${{ contains(matrix.edition, 'deploy') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Hugo
        shell: bash
        run: |
          set -euo pipefail
          echo "output hugo-version: ${{ steps.hugo.outputs.hugo-version }}"
          echo "output hugo-path:    ${{ steps.hugo.outputs.hugo-path }}"
          test -x "${{ steps.hugo.outputs.hugo-path }}"
          # v0.7/v0.8 print help with a non-zero exit code even though the
          # binary works; it was already smoke tested by the action.
          HUGO_VERSION_LINE="$(hugo version 2>/dev/null || true)"
          if [ -z "${HUGO_VERSION_LINE}" ]; then
            HUGO_VERSION_LINE="$(hugo -h 2>&1 | head -n 1 || true)"
          fi
          printf '%s\n' "${HUGO_VERSION_LINE}"
          # Edition assertions ("expect"/"reject") pin the Hugo v0.170.0
          # edition change: Extended is gone, Deploy lives in the standard
          # "withdeploy" build, and the hugo_extended_* aliases are never used.
          if [ -n "${{ matrix.expect || '' }}" ]; then
            if ! printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.expect }}"; then
              echo "::error::Expected '${{ matrix.expect }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi
          if [ -n "${{ matrix.reject || '' }}" ]; then
            if printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.reject }}"; then
              echo "::error::Did not expect '${{ matrix.reject }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi

  hugo-windows-arm64:
    name: Hugo / Windows ARM64 / ${{ matrix.version }} / ${{ matrix.edition }}
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '0.100.0', edition: 'standard' }             # native Windows-ARM64 build
          - { version: '0.169.0', edition: 'extended', expect: '+extended', expect_platform: 'windows/amd64' }  # AMD64 build (x64 emulation)
          - { version: '0.170.0', edition: 'extended', reject: '+extended', expect_platform: 'windows/arm64' }  # native standard ARM64 build
          - { version: '0.170.0', edition: 'extended-with-deploy', expect: '+withdeploy', reject: '+extended', expect_platform: 'windows/amd64' }  # no native withdeploy ARM64 asset
          - { version: '0.137.0', edition: 'extended-with-deploy' } # bumped to v0.137.1, AMD64 build
          - { version: 'latest', edition: 'standard' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        id: hugo
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: ${{ matrix.version }}
          verify-file: true
          extended: ${{ contains(matrix.edition, 'extended') }}
          with-deploy: ${{ contains(matrix.edition, 'deploy') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Hugo
        shell: bash
        run: |
          set -euo pipefail
          echo "output hugo-version: ${{ steps.hugo.outputs.hugo-version }}"
          echo "output hugo-path:    ${{ steps.hugo.outputs.hugo-path }}"
          test -f "${{ steps.hugo.outputs.hugo-path }}"
          # Default install-dir on Windows is C:\Program Files\Hugo (the
          # GitHub-hosted runner is elevated, so the primary is writable).
          echo "${{ steps.hugo.outputs.hugo-path }}" | grep -qF '\Program Files\Hugo\hugo.exe'
          # v0.7/v0.8 print help with a non-zero exit code even though the
          # binary works; it was already smoke tested by the action.
          HUGO_VERSION_LINE="$(hugo version 2>/dev/null || true)"
          if [ -z "${HUGO_VERSION_LINE}" ]; then
            HUGO_VERSION_LINE="$(hugo -h 2>&1 | head -n 1 || true)"
          fi
          printf '%s\n' "${HUGO_VERSION_LINE}"
          # Edition assertions ("expect"/"reject") pin the Hugo v0.170.0
          # edition change: Extended is gone, Deploy lives in the standard
          # "withdeploy" build, and the hugo_extended_* aliases are never used.
          if [ -n "${{ matrix.expect || '' }}" ]; then
            if ! printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.expect }}"; then
              echo "::error::Expected '${{ matrix.expect }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi
          if [ -n "${{ matrix.reject || '' }}" ]; then
            if printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.reject }}"; then
              echo "::error::Did not expect '${{ matrix.reject }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi
          # Windows ARM64 rows assert whether a native windows/arm64 build or
          # the AMD64 emulation fallback was installed.
          if [ -n "${{ matrix.expect_platform || '' }}" ]; then
            if ! printf '%s\n' "${HUGO_VERSION_LINE}" | grep -qF "${{ matrix.expect_platform }}"; then
              echo "::error::Expected platform '${{ matrix.expect_platform }}' in 'hugo version' for v${{ matrix.version }} / ${{ matrix.edition }}; got: ${HUGO_VERSION_LINE}"
              exit 1
            fi
          fi

  hugo-linux-arm64-expected-gap:
    name: Hugo / Ubuntu ARM64 / v0.19 / expected gap
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo (expected to fail)
        id: hugo
        continue-on-error: true
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: '0.19'
          verify-file: true

      - name: Assert the action failed with the ARM64 gap error
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.hugo.outcome }}" != 'failure' ]; then
            echo "::error::Expected the action to fail for Hugo v0.19 on Linux ARM64 (no ARM64 assets in v0.17.0-v0.20.2)"
            exit 1
          fi
          echo "Action failed as expected for v0.19 on Linux ARM64."

  dart-sass-linux:
    name: Dart Sass / Ubuntu / ${{ matrix.version }} / ${{ matrix.downloader || 'aria2' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 'latest' }
          - { version: '1.63.0', downloader: 'curl' }
          - { version: 'latest', downloader: '2c' }
          - { version: '1.105.2', verify: 'false' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart Sass
        id: sass
        uses: ./.github/actions/setup-dart-sass
        with:
          dart-sass-version: ${{ matrix.version }}
          verify-file: ${{ matrix.verify || 'true' }}
          downloader: ${{ matrix.downloader || 'aria2' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Dart Sass
        shell: bash
        run: |
          set -euo pipefail
          echo "output dart-sass-version: ${{ steps.sass.outputs.dart-sass-version }}"
          echo "output dart-sass-path:    ${{ steps.sass.outputs.dart-sass-path }}"
          sass_path='${{ steps.sass.outputs.dart-sass-path }}'
          install_dir="$(dirname "${sass_path}")"
          test -x "${sass_path}"
          # Default install-dir on Linux is /usr/local/bin; GitHub-hosted
          # Ubuntu runners can write there without elevation. The payload is
          # a private directory inside the install dir.
          test "${sass_path}" = '/usr/local/bin/sass'
          test -L "${sass_path}"
          # The installer uses a relative link so the payload can move with the
          # install directory; resolve it against the link's own directory.
          link_target="$(readlink "${sass_path}")"
          case "${link_target}" in
            /*) payload_dir="$(dirname "${link_target}")" ;;
            *) payload_dir="$(dirname "${sass_path}")/$(dirname "${link_target}")" ;;
          esac
          payload_dir="$(cd "${payload_dir}" && pwd)"
          test "${payload_dir}" = '/usr/local/bin/.dart-sass'
          test -f "${payload_dir}/sass"
          test -f "${payload_dir}/src/sass.snapshot"
          test -f "${payload_dir}/src/dart"
          test -f "${payload_dir}/src/LICENSE"
          test ! -e "${install_dir}/src"
          test ! -e "${install_dir}/LICENSE"
          test ! -e /usr/local/share/dart-sass
          test ! -e /usr/local/share/licenses/dart-sass
          sass --version

  dart-sass-windows:
    name: Dart Sass / Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart Sass
        id: sass
        uses: ./.github/actions/setup-dart-sass
        with:
          dart-sass-version: 'latest'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Dart Sass
        shell: bash
        run: |
          set -euo pipefail
          echo "output dart-sass-version: ${{ steps.sass.outputs.dart-sass-version }}"
          echo "output dart-sass-path:    ${{ steps.sass.outputs.dart-sass-path }}"
          sass_path='${{ steps.sass.outputs.dart-sass-path }}'
          test -f "${sass_path}"
          # Default install-dir on Windows is C:\Program Files\Dart Sass (the
          # GitHub-hosted runner is elevated, so the primary is writable).
          # The archive is extracted directly into install-dir; a bash wrapper
          # sits beside the upstream sass.bat.
          echo "${sass_path}" | grep -qF '\Program Files\Dart Sass\sass.bat'
          install_dir="$(dirname "$(cygpath -u "${sass_path}")")"
          test -f "${install_dir}/sass.bat"
          test -f "${install_dir}/sass"
          test -f "${install_dir}/src/dart.exe"
          test -f "${install_dir}/src/sass.snapshot"
          test -f "${install_dir}/src/LICENSE"
          test ! -e "${install_dir}/dart-sass"
          test ! -e "${install_dir}/LICENSE"
          sass --version

  dart-sass-macos-arm64:
    name: Dart Sass / macOS ARM64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart Sass
        id: sass
        uses: ./.github/actions/setup-dart-sass
        with:
          dart-sass-version: 'latest'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Dart Sass
        shell: bash
        run: |
          set -euo pipefail
          echo "output dart-sass-version: ${{ steps.sass.outputs.dart-sass-version }}"
          echo "output dart-sass-path:    ${{ steps.sass.outputs.dart-sass-path }}"
          sass_path='${{ steps.sass.outputs.dart-sass-path }}'
          install_dir="$(dirname "${sass_path}")"
          test -x "${sass_path}"
          # Default install-dir on macOS is /usr/local/bin when writable
          # (otherwise ~/.local/bin), matching Linux. The payload is a private
          # directory inside the install dir.
          if mkdir -p '/usr/local/bin' 2>/dev/null && ( : > "/usr/local/bin/.install-dir-test.$$" ) 2>/dev/null; then
            rm -f "/usr/local/bin/.install-dir-test.$$"
            test "${sass_path}" = '/usr/local/bin/sass'
          else
            test "${sass_path}" = "${HOME}/.local/bin/sass"
          fi
          test -L "${sass_path}"
          # The installer uses a relative link so the payload can move with the
          # install directory; resolve it against the link's own directory.
          link_target="$(readlink "${sass_path}")"
          case "${link_target}" in
            /*) payload_dir="$(dirname "${link_target}")" ;;
            *) payload_dir="$(dirname "${sass_path}")/$(dirname "${link_target}")" ;;
          esac
          payload_dir="$(cd "${payload_dir}" && pwd)"
          case "${payload_dir}" in
            /usr/local/bin/.dart-sass|"${HOME}/.local/bin/.dart-sass")
              ;;
            *)
              echo "::error::Unexpected payload directory: ${payload_dir}"
              exit 1 ;;
          esac
          test -f "${payload_dir}/sass"
          test -f "${payload_dir}/src/sass.snapshot"
          test -f "${payload_dir}/src/dart"
          test -f "${payload_dir}/src/LICENSE"
          test ! -e "${install_dir}/src"
          test ! -e "${install_dir}/LICENSE"
          test ! -e /usr/local/share/dart-sass
          test ! -e /usr/local/share/licenses/dart-sass
          test ! -e "${HOME}/.local/share/dart-sass"
          test ! -e "${HOME}/.local/share/licenses/dart-sass"
          sass --version

